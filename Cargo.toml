[workspace]
members = ["crates/packager", "crates/packager-cli"]
default-members = ["crates/packager", "crates/packager-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tensorai-co/packager"
homepage = "https://github.com/tensorai-co/packager"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "deny"
todo = "deny"

[profile.test]
opt-level = 2
