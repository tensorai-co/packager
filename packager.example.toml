# packager.toml mirrors the library one-to-one: [app] is `App`, [package.*] are the builders.
# Paths are relative to this file.

[app]
name = "My App"
identifier = "com.example.myapp"
version = "1.4.0"
# build_number = "812"            # CFBundleVersion; required for pre-release versions on macOS
publisher = "Example Ltd"
description = "Writes notes."
copyright = "© 2026 Example Ltd"
icon = "assets/icon.png"          # one PNG (1024×1024 ideally); .icns is generated
url_schemes = ["myapp"]
file_types = [{ extension = "md", name = "Markdown document" }]   # mime_type = "…" for Linux (optional)
resources = [{ from = "dist/", to = "web" }]

[app.binaries]
macos-arm64 = "target/aarch64-apple-darwin/release/my-app"
macos-x64 = "target/x86_64-apple-darwin/release/my-app"   # merged into a universal binary
windows-x64 = "target/x86_64-pc-windows-msvc/release/my-app.exe"
linux-x64 = "target/x86_64-unknown-linux-gnu/release/my-app"      # one .deb / .snap per Linux binary
# linux-arm64 = "target/aarch64-unknown-linux-gnu/release/my-app"
# macos-universal = "target/universal/release/my-app"

[package.app]
min_macos = "11.0"
category = "public.app-category.productivity"
# frameworks = ["vendor/Some.framework"]
# info_plist = { NSMicrophoneUsageDescription = "For voice notes." }

[package.dmg]
# background = "assets/dmg.png"   # window takes its size; name it …@2x.png for Retina art
icon_size = 128
window_size = [540, 380]
app_position = [140, 180]
applications_position = [400, 180]

[package.pkg]
install_location = "/Applications"
# postinstall = "scripts/postinstall"

[package.msi]                     # one per Windows binary; UpgradeCode etc. are derived
# scope = "per-user"               # %LocalAppData%\Programs, no UAC prompt (default per-machine)
# upgrade_code = "{…}"             # only when migrating from another installer
# shortcut = false                 # no Start menu shortcut
# ui = "wizard"                    # Welcome / progress / finished screens (default: basic progress)

[package.msix]                    # one per Windows binary; needs [sign.windows] to install
# [package.msixbundle]             # all Windows binaries' .msix in one bundle (takes [package.msix]'s settings)
# archs = ["windows-x64", "windows-arm64"]
# min_version = "10.0.17763.0"
# background = "transparent"
# execution_alias = "my-app"       # run as `my-app` from a terminal (command-line apps)

[package.deb]                     # name_version_arch.deb; `Depends: libc6 (>= …)` is detected
maintainer = "Example Ltd <packages@example.com>"
# depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0"]
# homepage = "https://example.com"
# license = "MIT"                   # in /usr/share/doc/<name>/copyright (default proprietary)
# man_page = "docs/my-app.1"        # Debian wants one per command in /usr/bin
# install_dir = "/opt/myapp"        # default; "/usr/lib/myapp" is the distro-style choice
# categories = ["Utility"]          # freedesktop menu categories
# compression = "xz"                # default gzip
# revision = "1"                    # 1.4.0-1
# name = "myapp"                    # default: the identifier's last part
# postinst = "scripts/postinst"     # also preinst, prerm, postrm

[package.snap]                    # name_version_arch.snap; install with `snap install --dangerous`
# base = "core24"                   # default
# confinement = "strict"            # strict (default), classic or devmode
# extra_plugs = ["camera"]          # added to desktop, desktop-legacy, wayland, x11, opengl, audio-playback, network, home
# plugs = ["home", "network"]       # replaces the default list
# license = "MIT"                   # SPDX
# summary = "Writes notes."         # ≤ 78 characters; default: the description's first line
# grade = "stable"                  # default stable, devel for pre-releases
# cli = true                        # no menu entry, home + network plugs
# environment = { MY_VAR = "$SNAP/data" }

[sign.apple]
# "-" is ad hoc. Otherwise a keychain identity ("Developer ID Application: …", a unique part of
# its name, or its SHA-1), "p12:certs.p12" (password from PACKAGER_P12_PASSWORD) or
# "pem:cert.pem,key.pem".
identity = "-"
# installer_identity = "Developer ID Installer"   # signs the .pkg (productsign)
hardened_runtime = true
# entitlements = "app.entitlements"
# timestamp = "auto"               # auto (Developer ID only, like codesign), apple, none, or a URL
# requirements = 'designated => identifier "com.example.myapp" and anchor apple generic'

# Authenticode for every .exe and .msix: a keychain/PEM/PKCS#12 identity as above.
# [sign.windows]
# identity = "p12:codesign.pfx"
# timestamp = "http://timestamp.digicert.com"

# Notarize and staple every package after the build (`packager build --no-notarize` skips it).
# Needs Developer ID identities above. The key can also come from PACKAGER_NOTARY_KEY,
# PACKAGER_NOTARY_KEY_ID and PACKAGER_NOTARY_ISSUER, which keeps it out of the repository.
# [notarize]
# key = "AuthKey_ABCDE12345.p8"    # App Store Connect API key; the key ID is read from the name
# issuer = "00000000-0000-0000-0000-000000000000"   # omit for individual keys
# timeout_minutes = 30
# staple = true

[build]
out_dir = "target/dist"
